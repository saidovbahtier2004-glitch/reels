<!doctype html>
<html><head><meta charset="utf-8"><title>Fox Shadow</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="timeline.js"></script>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,GY=1420;
const cv=document.getElementById('c');let ctx=cv.getContext('2d');const main=ctx;
const off=document.createElement('canvas');off.width=1080;off.height=1920;const octx=off.getContext('2d');
const L={};TL.lines.forEach(l=>L[l.key]=l);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2};
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const envAt=t=>TL.env[Math.floor(t*TL.fps)]||0;
const speaking=(t,k)=>t>=L[k].start&&t<=L[k].end?envAt(t):0;
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}

function ell(x,y,rx,ry,col,rot=0){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot,0,Math.PI*2);ctx.fillStyle=col;ctx.fill()}
function poly(pts,col){ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.closePath();ctx.fillStyle=col;ctx.fill()}

/* ---------- world state ---------- */
function cloudState(t){ // 0 sunny .. 1 cloudy, and cloud x offset
  if(t<30){const c=ease(prog(t,10.4,12.6));return{c,x:lerp(1700,0,c)}}
  const p=ease(prog(t,29.8,32.4));return{c:1-p,x:lerp(0,-1900,p)}
}
function warm(t){return ease(prog(t,37,41))}

function drawSky(t,cs){
  const g=ctx.createLinearGradient(0,0,0,GY);
  const w=warm(t),c=cs.c;
  const top=mix(mix('#4FB3F0','#6E7F95',c),'#FF8A5C',w*.8);
  const bot=mix(mix('#BFE9FF','#AEB8C4',c),'#FFD59E',w*.8);
  g.addColorStop(0,top);g.addColorStop(1,bot);
  ctx.fillStyle=g;ctx.fillRect(-2000,-500,6000,GY+500);
}
function hex(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mix(a,b,t){const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('')}

function drawSun(t,cs){
  const x=820,y=330,w=warm(t),sy=y+w*260;
  ctx.save();ctx.translate(x,sy);
  ctx.rotate(t*.25);
  for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);poly([-14,-140,14,-140,0,-200-10*Math.sin(t*3+i)],'#FFD23F')}
  ctx.restore();
  ell(x,sy,125,125,'#FFE066');ell(x,sy,105,105,'#FFD23F');
  // face
  ell(x-35,sy-15,9,13,'#7A4A00');ell(x+35,sy-15,9,13,'#7A4A00');
  ctx.beginPath();ctx.arc(x,sy+15,38,.15*Math.PI,.85*Math.PI);ctx.lineWidth=8;ctx.lineCap='round';ctx.strokeStyle='#7A4A00';ctx.stroke();
  ell(x-62,sy+18,16,10,'rgba(255,120,80,.5)');ell(x+62,sy+18,16,10,'rgba(255,120,80,.5)');
}
function cloud(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  [[-120,10,80],[-40,-40,100],[60,-20,90],[130,20,70],[0,30,95]].forEach(([a,b,r])=>ell(a,b,r,r,col));ctx.restore()}
function drawClouds(t,cs){
  // background drifting small clouds always
  for(let i=0;i<4;i++){const x=((i*400+t*25)%1700)-300;cloud(x,180+i*90+(i%2)*120,.55,'rgba(255,255,255,.75)')}
  if(cs.x<1650){const g=mix('#FFFFFF','#9AA4B2',cs.c);
    cloud(820+cs.x,330,1.6,g);cloud(380+cs.x*1.2,520,1.2,mix('#FFFFFF','#8C96A6',cs.c));cloud(1150+cs.x*.9,600,1.1,g);cloud(150+cs.x*1.3,260,1.0,mix('#FFFFFF','#A3ACB9',cs.c));}
}
function drawHills(t,cam){
  ctx.save();ctx.translate(-cam*.3,0);
  ctx.fillStyle='#8FD18A';ctx.beginPath();ctx.moveTo(-1500,GY);
  for(let x=-1500;x<=4500;x+=60)ctx.lineTo(x,GY-260-90*Math.sin(x/260)-50*Math.sin(x/110));
  ctx.lineTo(4500,GY);ctx.fill();ctx.restore();
  ctx.save();ctx.translate(-cam*.6,0);
  ctx.fillStyle='#62B85E';ctx.beginPath();ctx.moveTo(-1500,GY);
  for(let x=-1500;x<=4500;x+=60)ctx.lineTo(x,GY-140-60*Math.sin(x/190+1));
  ctx.lineTo(4500,GY);ctx.fill();ctx.restore();
}
function tree(x,s,t,i){ctx.save();ctx.translate(x,GY);ctx.scale(s,s);
  const sw=Math.sin(t*1.2+i)*.03;ctx.rotate(sw);
  ctx.fillStyle='#8B5A2B';ctx.beginPath();ctx.moveTo(-28,0);ctx.lineTo(-18,-330);ctx.lineTo(18,-330);ctx.lineTo(28,0);ctx.fill();
  ell(0,-420,150,130,'#2E8B3E');ell(-90,-360,100,85,'#36A04A');ell(90,-360,100,85,'#36A04A');ell(0,-500,110,95,'#43B556');
  ell(-40,-480,30,22,'rgba(255,255,255,.18)');
  // apples
  [[-60,-400],[70,-430],[20,-340]].forEach(([a,b])=>ell(a,b,14,14,'#E63946'));
  ctx.restore()}
function rock(x,s){ctx.save();ctx.translate(x,GY);ctx.scale(s,s);
  ell(0,-60,170,95,'#8D99AE');ell(-30,-80,120,70,'#A7B1C2');ell(-60,-105,40,20,'rgba(255,255,255,.35)');ctx.restore()}
function river(x0,x1,t){ctx.save();
  ctx.fillStyle='#4CC3F5';ctx.fillRect(x0,GY-8,x1-x0,260);
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=6;ctx.lineCap='round';
  for(let i=0;i<10;i++){const xx=x0+((i*90+t*80)%(x1-x0-60))+20,yy=GY+30+(i%4)*55;ctx.beginPath();ctx.moveTo(xx,yy);ctx.quadraticCurveTo(xx+20,yy-10,xx+40,yy);ctx.stroke()}
  ctx.restore()}
function drawGround(t,cam){
  const g=ctx.createLinearGradient(0,GY,0,H);g.addColorStop(0,'#5DBB4F');g.addColorStop(1,'#3E9A3A');
  ctx.fillStyle=g;ctx.fillRect(cam-600,GY-10,W+1200,H-GY+20);
  for(let i=0;i<70;i++){const x=Math.floor(cam/60)*60+i*35-300+rnd(i+Math.floor(cam/60))*20,y=GY+40+rnd(i*3)*420;
    ctx.strokeStyle='#2F7D2E';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-6,y-22);ctx.moveTo(x,y);ctx.lineTo(x+7,y-20);ctx.stroke()}
}
function flowers(t,cam){
  for(let i=0;i<14;i++){const x=i*170-200+rnd(i)*80,y=GY+60+rnd(i+9)*380;if(x<cam-200||x>cam+W+200)continue;
    const cols=['#FF6B9E','#FFD23F','#FFFFFF','#B388FF'];const col=cols[i%4];const b=Math.sin(t*2+i)*4;
    ctx.strokeStyle='#2F7D2E';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+b,y-40);ctx.stroke();
    for(let k=0;k<5;k++){const a=k/5*Math.PI*2+t*.5;ell(x+b+Math.cos(a)*14,y-40+Math.sin(a)*14,11,11,col)}ell(x+b,y-40,9,9,'#FF9F1C')}
}

/* ---------- fox ---------- */
function drawFox(o){
  // o: x,y(feet),s,face(1/-1),walk(phase),wag,blink,expr,mouth,mono,lookUp,sit
  ctx.save();ctx.translate(o.x,o.y);
  if(o.shadowT)ctx.transform(1,0,o.shadowT.k,o.shadowT.d,0,0);
  ctx.scale(o.s*o.face,o.s);
  const M=o.mono;const C=(c)=>M||c;
  const OR=C('#F27A24'),DK=C('#C9561A'),WH=C('#FFF6EC'),BL=C('#2B1B12');
  const sit=o.sit||0,wk=o.walk||0;
  // tail
  ctx.save();ctx.translate(-80,-110+sit*30);ctx.rotate(-.5+Math.sin(o.wag)*.25);
  ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-60,-10,-150,-60,-160,-170);ctx.bezierCurveTo(-120,-150,-40,-110,20,-40);ctx.closePath();ctx.fillStyle=OR;ctx.fill();
  ell(-150,-160,30,38,WH,-.4);ctx.restore();
  // legs
  const legs=[[-55,0],[-25,1],[35,0],[65,1]];
  legs.forEach(([lx,ph],i)=>{const sw=Math.sin(wk+ph*Math.PI)*22*(sit?0:1);
    ctx.save();ctx.translate(lx,-70+sit*20);ctx.rotate(sw*Math.PI/180*(i%2?1:-1));
    const len=sit&&i<2?40:70;ctx.fillStyle=i%2?DK:OR;ctx.beginPath();ctx.roundRect(-14,0,28,len,12);ctx.fill();
    ell(0,len,18,11,M?M:'#3A2418');ctx.restore()});
  // body
  ell(0,-115+sit*25,100,68,OR,sit*-.35);
  ell(60,-110+sit*15,42,48,WH);
  // head
  ctx.save();ctx.translate(80,-200+sit*15);ctx.rotate((o.lookUp||0)*-.35+(o.tilt||0));
  poly([-45,-35,-60,-130,0,-55],OR);poly([15,-55,45,-140,60,-40],OR);
  if(!M){poly([-42,-45,-52,-110,-10,-58],'#3A2418');poly([22,-58,42,-118,50,-48],'#3A2418')}
  ell(0,0,72,66,OR);
  // snout
  ell(55,22,52,32,WH,-.1);ell(-20,28,34,26,WH);
  ell(102,12,13,10,BL);
  if(!M){
    const bl=o.blink||1,ex=o.expr||'happy';
    if(ex==='shock'){ell(10,-12,20,24,'#fff');ell(48,-14,18,22,'#fff');ell(13,-10,9,11,BL);ell(50,-12,8,10,BL)}
    else{ell(12,-12,10,14*bl,BL);ell(48,-14,9,13*bl,BL);ell(15,-17,3.5,3.5*bl,'#fff');ell(51,-19,3,3*bl,'#fff')}
    if(ex==='sad'){ctx.strokeStyle=BL;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-2,-32);ctx.lineTo(22,-42);ctx.moveTo(38,-42);ctx.lineTo(60,-32);ctx.stroke()}
    ell(-18,10,13,8,'rgba(255,110,110,.55)');
    const mo=o.mouth||0;
    if(mo>.05){ell(62,46,12+mo*6,4+mo*16,'#7A1E1E');}
    else if(ex==='shock'){ell(62,46,10,13,'#7A1E1E')}
    else if(ex==='sad'){ctx.strokeStyle=BL;ctx.lineWidth=5;ctx.beginPath();ctx.arc(62,58,14,1.15*Math.PI,1.85*Math.PI);ctx.stroke()}
    else{ctx.strokeStyle=BL;ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.arc(62,34,14,.15*Math.PI,.85*Math.PI);ctx.stroke()}
    if(o.tear){ell(30,10+o.tear*40,7,10,'#6EC6FF')}
  }
  ctx.restore();ctx.restore();
}
function foxWithShadow(o,shadowA,dance=0,t=0){
  if(shadowA>.01){const tr=main.getTransform();octx.setTransform(1,0,0,1,0,0);octx.clearRect(0,0,W,H);octx.setTransform(tr);
    const so=Object.assign({},o,{mono:'#1d2a1a',y:GY+6,shadowT:{k:.6+Math.sin(t*4)*.3*dance,d:-.28},blink:1});
    if(dance){so.walk=t*10;so.wag=t*8}
    ctx=octx;drawFox(so);ctx=main;
    main.save();main.setTransform(1,0,0,1,0,0);main.globalAlpha=shadowA;main.drawImage(off,0,0);main.restore()}
  drawFox(o);
}

/* ---------- owl ---------- */
function drawOwl(x,y,s,t,talk,appear){
  if(appear<=0)return;ctx.save();ctx.translate(x,y);const sc=s*ease(appear)*(1+Math.sin(appear*Math.PI)*.15);ctx.scale(sc,sc);
  ctx.fillStyle='#8B5A2B';ctx.beginPath();ctx.roundRect(-220,40,440,30,15);ctx.fill();
  const fl=Math.sin(t*14)*talk*.4;
  ctx.save();ctx.translate(-70,-10);ctx.rotate(.3+fl);ell(0,0,35,75,'#6B4A2E');ctx.restore();
  ctx.save();ctx.translate(70,-10);ctx.rotate(-.3-fl);ell(0,0,35,75,'#6B4A2E');ctx.restore();
  ell(0,-20,80,95,'#8C6A48');ell(0,5,52,62,'#D9C2A0');
  for(let i=0;i<6;i++)ell(-25+(i%3)*25,-10+Math.floor(i/3)*30,9,6,'#B89A76');
  poly([-60,-95,-75,-150,-25,-105],'#6B4A2E');poly([60,-95,75,-150,25,-105],'#6B4A2E');
  const bl=(Math.sin(t*1.7)>.97)?.1:1;
  ell(-32,-70,30,30,'#FFF');ell(32,-70,30,30,'#FFF');ell(-32,-68,14,14*bl,'#2B1B12');ell(32,-68,14,14*bl,'#2B1B12');
  // glasses
  ctx.strokeStyle='#5A3A1A';ctx.lineWidth=5;ctx.beginPath();ctx.arc(-32,-70,34,0,7);ctx.moveTo(66,-70);ctx.arc(32,-70,34,0,7);ctx.stroke();
  const o=talk*12;poly([-12,-40,12,-40,0,-18+o*.3],'#FFB347');if(o>1)ell(0,-28+o*.6,8,o*.6,'#7A1E1E');
  ell(-25,40,14,8,'#FFB347');ell(25,40,14,8,'#FFB347');
  ctx.restore()}

/* ---------- fx ---------- */
function sparkles(t,a,cx,cy,n=16,r=380){if(a<=0)return;
  for(let i=0;i<n;i++){const ang=i/n*Math.PI*2+t*.6,rr=r*(.6+.4*Math.sin(t*2+i)),x=cx+Math.cos(ang)*rr,y=cy+Math.sin(ang)*rr*.6;
    const s=(10+8*Math.sin(t*6+i))*a;ctx.save();ctx.translate(x,y);ctx.rotate(t+i);
    ctx.globalAlpha=a;poly([0,-s*2,s*.5,-s*.5,s*2,0,s*.5,s*.5,0,s*2,-s*.5,s*.5,-s*2,0,-s*.5,-s*.5],'#FFF3A0');ctx.restore()}}
function heart(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.moveTo(0,15);
  ctx.bezierCurveTo(-40,-15,-20,-45,0,-25);ctx.bezierCurveTo(20,-45,40,-15,0,15);ctx.fillStyle=col;ctx.fill();ctx.restore()}
function bubbleText(x,y,txt,a,size=120,col='#FFFFFF'){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.font=`900 ${size}px "Baloo 2","Comic Sans MS",Arial Rounded MT Bold,sans-serif`;
  ctx.textAlign='center';ctx.lineWidth=16;ctx.strokeStyle='#3A2418';ctx.lineJoin='round';ctx.strokeText(txt,x,y);ctx.fillStyle=col;ctx.fillText(txt,x,y);ctx.restore()}

/* ---------- main ---------- */
function searchX(t){const st=[[13.9,250],[15.5,560],[16.1,1240],[17.4,1300],[18.0,2050],[19.6,2120]];
  let x=st[0][1];for(let i=0;i<st.length-1;i++){if(t>=st[i][0]&&t<st[i+1][0])x=lerp(st[i][1],st[i+1][1],ease(prog(t,st[i][0],st[i+1][0])))}if(t>=st[st.length-1][0])x=st[st.length-1][1];return x}
function draw(t){
  const cs=cloudState(t);
  const inSearch=t>=L.search.start-.7&&t<L.cry.start-.7;
  let cam=0;
  if(inSearch){cam=clamp(searchX(t)-470,0,2300)}
  // camera zoom (Ken Burns)
  let zoom=1.0,zx=540,zy=1200;
  if(t<L.play.start-.7)zoom=lerp(1.0,1.06,prog(t,0,5.6));
  else if(t<L.cloud.start-.7)zoom=1.12;
  else if(t<L.search.start-.7)zoom=lerp(1.05,1.18,prog(t,12.4,14));
  else if(inSearch)zoom=1.04;
  else if(t<L.owl.start-.7){zoom=lerp(1.25,1.35,prog(t,19.3,22));zy=1250}
  else if(t<L.wait.start-.7){zoom=1.0;zy=1100}
  else if(t<L.back.start-.7)zoom=lerp(1.0,1.08,prog(t,27.3,31.8));
  else if(t<L.moral.start-.7)zoom=1.1;
  else zoom=lerp(1.1,1.0,prog(t,36,42));
  ctx.save();ctx.translate(zx,zy);ctx.scale(zoom,zoom);ctx.translate(-zx,-zy);

  drawSky(t,cs);drawSun(t,cs);drawClouds(t,cs);
  drawHills(t,cam);
  ctx.save();ctx.translate(-cam,0);
  // scenery
  tree(-60,1.25,t,1);tree(1120,1.1,t,2);
  if(inSearch||cam>0){rock(700,1.0);tree(1450,1.15,t,3);river(2180,3200,t);tree(3500,1.2,t,4)}
  drawGround(t,cam);
  if(inSearch)river(2180,3300,t);
  flowers(t,cam);

  const shadowA=.38*(1-cs.c)*(1-warm(t)*.3);
  const blink=(Math.sin(t*1.3)>.985||Math.sin(t*.7+2)>.993)?.1:1;
  let fox={x:540,y:GY,s:1.4,face:1,walk:0,wag:t*4,blink,expr:'happy',mouth:0};
  // per scene fox behaviour
  if(t<L.play.start-.7){const p=prog(t,.3,4.6);fox.x=lerp(-250,470,ease(p));fox.walk=t*9*(p<1?1:0);}
  else if(t<L.cloud.start-.7){fox.x=470;const ph=(t-5)*2.6;const j=Math.max(0,Math.sin(ph*Math.PI));fox.y=GY-j*170;fox.face=Math.floor(ph)%2?-1:1;fox.wag=t*10;}
  else if(t<L.search.start-.7){fox.x=470;if(t>12.5){fox.expr='shock';fox.lookDown=1;fox.tilt=.25;fox.y=GY-Math.max(0,Math.sin(prog(t,12.5,13)*Math.PI))*60}else fox.walk=t*9,fox.x=lerp(470,520,prog(t,10,12.5))}
  else if(inSearch){
    fox.x=searchX(t);fox.walk=t*14;fox.expr='sad';fox.tilt=Math.sin(t*5)*.12;
  }
  else if(t<L.owl.start-.7){fox.x=470;fox.sit=1;fox.expr='sad';fox.mouth=speaking(t,'cry');fox.lookUp=.3;fox.tear=(t*1.2)%1;fox.wag=t*1.5;}
  else if(t<L.wait.start-.7){fox.x=330;fox.sit=1;fox.expr='happy';fox.lookUp=1;fox.wag=t*2;fox.s=1.15}
  else if(t<L.back.start-.7){fox.x=470;fox.sit=1;fox.lookUp=prog(t,29,31);fox.wag=t*2;fox.expr=t>31?'happy':'sad';}
  else if(t<L.moral.start-.7){fox.x=470;const ph=(t-32)*2.2;fox.y=GY-Math.max(0,Math.sin(ph*Math.PI))*150;fox.face=Math.floor(ph)%2?-1:1;fox.wag=t*12;fox.expr=t<33.2?'shock':'happy'}
  else{fox.x=lerp(470,430,prog(t,36,40));fox.sit=1;fox.wag=t*2.5;fox.lookUp=.2}

  const dance=(t>=L.back.start-.3&&t<L.moral.start-.7)?1:0;
  foxWithShadow(fox,shadowA,dance,t);

  // owl
  const owlOn=t>=L.owl.start-.8&&t<L.back.start-.7;
  if(owlOn){const ox=780,oy=900;
    ctx.save();tree(860,1.55,t,7);ctx.restore();
    drawOwl(ox,oy,1.25,t,speaking(t,'owl'),prog(t,L.owl.start-.8,L.owl.start-.2));}

  ctx.restore();// cam

  // overlays
  if(inSearch){const q=Math.sin(t*6);bubbleText(W/2+q*20,700,'?',.9,160,'#FFE066')}
  if(t>12.6&&t<14.2){const a=prog(t,12.6,12.85);bubbleText(640,980,'!',a,220,'#FF5A5A')}
  if(t>=L.back.start-.4&&t<L.moral.start+.5)sparkles(t,prog(t,32.3,33)*(1-prog(t,36.2,37)),540,1250);
  if(t>=5.2&&t<9.6){for(let i=0;i<5;i++){const p=((t-5.2)*.5+i/5)%1;ctx.globalAlpha=1-p;heart(300+i*130+Math.sin(t*2+i)*30,1150-p*500,1.4,'#FF6B9E')}ctx.globalAlpha=1}
  if(t>=L.moral.start){for(let i=0;i<6;i++){const p=((t-36)*.35+i/6)%1;ctx.globalAlpha=(1-p)*.9;heart(250+i*120+Math.sin(t+i)*40,1250-p*700,1.6,'#FF6B9E')}ctx.globalAlpha=1}

  // gloom overlay
  if(cs.c>0){ctx.fillStyle=`rgba(40,50,80,${cs.c*.22})`;ctx.fillRect(-500,-500,W+1000,H+1000)}
  ctx.restore();// zoom
  // warm sunset tint
  const w=warm(t);if(w>0){ctx.fillStyle=`rgba(255,140,60,${w*.15})`;ctx.fillRect(0,0,W,H)}

  // title & end cards
  const ta=t<2.8?1:1-prog(t,2.8,3.6);
  if(ta>0){ctx.save();ctx.globalAlpha=ta;ctx.fillStyle='rgba(255,255,255,.0)';
    const s=1+Math.sin(prog(t,0,.5)*Math.PI)*.08;ctx.translate(W/2,480);ctx.scale(s,s);
    bubbleText(0,140,'The Fox Who',ta,118,'#FFE066');bubbleText(0,275,'Lost His Shadow',ta,118,'#FFFFFF');ctx.restore()}
  if(t>41){const a=prog(t,41,41.7);bubbleText(W/2,560,'The End',a,150,'#FFE066')}

  // scene-cut flash
  const cuts=[L.play.start-.7,L.search.start-.7,L.cry.start-.7,L.owl.start-.7,L.moral.start-.7];
  cuts.forEach(c=>{if(t>=c&&t<c+.3){ctx.fillStyle=`rgba(255,255,255,${(1-(t-c)/.3)*.5})`;ctx.fillRect(0,0,W,H)}});
  // fade in/out
  if(t<.4){ctx.fillStyle=`rgba(0,0,0,${1-t/.4})`;ctx.fillRect(0,0,W,H)}
  if(t>TL.duration-.6){ctx.fillStyle=`rgba(0,0,0,${prog(t,TL.duration-.6,TL.duration)})`;ctx.fillRect(0,0,W,H)}
}
window.renderFrame=(t)=>{ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);draw(t);return cv.toDataURL('image/jpeg',.92)};
if(!navigator.webdriver){const t0=performance.now();(function loop(){draw(((performance.now()-t0)/1000)%TL.duration);requestAnimationFrame(loop)})()}
</script></body></html>
